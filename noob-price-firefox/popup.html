<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>NoobPrice</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="popup-header">
      <h1 class="popup-title">
        <img id="popup-icon" src="icon-48.png" alt="" width="26" height="26" />
        NoobPrice
        <span id="game-title" class="game-title"></span>
      </h1>
      <hr class="popup-hr" />
    </header>
    <div id="results" class="results">Carregando jogo...</div>
    <div id="noobprice-chart" class="chart-wrap"></div>
    <footer class="popup-footer">
      <a href="https://noob-price.vercel.app/apoie" target="_blank" rel="noopener noreferrer" class="popup-apoie" aria-label="Apoie o projeto NoobPrice">Apoie o projeto</a>
      <a href="https://noob-price.vercel.app/feedback" target="_blank" rel="noopener noreferrer" class="popup-feedback" aria-label="Enviar sugestão ou reportar bug">Feedback</a>
    </footer>
    <script src="chart.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
